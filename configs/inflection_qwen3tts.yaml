# Inflection Qwen3-TTS deployment: our fine-tuned CustomVoice checkpoint.
#
# Differs from configs/qwen3tts.yaml only in pointing model_path_hf at a local
# directory. The stock config serves Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice from
# the Hub, which is HEADLESS (no pointer_head.pt) and so returns no word
# timestamps — benchmarking timestamp work against it measures nothing.
model: "qwen3_tts"
max_seq_len: 32768

# Weights are NOT pinned here on purpose. Set $MSTAR_MODEL_PATH to a checkpoint
# directory (see _resolve_model_path in api_server/entrypoint.py), which is how
# the serving image is driven — a container mounts a checkpoint and points the
# env var at it, with no baked-in absolute path to edit.
#
#   export MSTAR_MODEL_PATH=/path/to/qwen3-tts/checkpoint-final
#
# The directory needs config.json, generation_config.json, model.safetensors and
# speech_tokenizer/config.json. To pin a deployment to one checkpoint instead,
# add `model_kwargs: {model_path_hf: /path}` here — yaml wins over the env var.
#
# NOTE: this requires a 1.7B-capable M* (see Gate 0b in the parity spec). Stock
# M* rejects unequal Talker/CodePredictor hidden sizes.

# The supported deployment image cannot build FlashInfer's Hopper FA3 JIT
# kernels yet. Keep the model default on "auto" and pin this deployment to FA2.
resources:
  talker_attn:
    flashinfer_backend: fa2
node_groups:
  - node_names: [Talker]
    ranks: [0]
    graph_walks: [talker_prefill, talker_decode]
  - node_names: [Codec]
    ranks: [0]
    graph_walks: [codec_chunk]
