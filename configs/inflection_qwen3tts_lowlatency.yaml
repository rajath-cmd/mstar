# Inflection Qwen3-TTS — LOW-LATENCY profile (voice agents, barge-in).
#
# Identical to configs/inflection_qwen3tts.yaml except for codec streaming
# cadence, which is the whole time-to-first-audio story.
#
# The checkpoint ships chunk_frames=300. At 12.5 Hz that is 300 x 80 ms = 24 s
# of audio buffered before the Codec node emits ANY PCM, so short replies finish
# generating before a single byte leaves the server. Measured TTFA on the stock
# value: 395 ms p50 at concurrency 1, against vllm-omni's 39 ms — a 10x loss on
# the one metric a voice agent feels.
#
# vllm-omni streams codec_chunk_frames=1 with codec_left_context_frames=25;
# this profile matches it. Lower chunk_frames means more, smaller decoder
# invocations — pure throughput drops somewhat, which is the trade a realtime
# deployment wants and a batch deployment does not. Use the batch config for
# offline synthesis.
#
# Weights: set $MSTAR_MODEL_PATH (see _resolve_model_path in entrypoint.py).
model: "qwen3_tts"
max_seq_len: 32768

model_kwargs:
  # Chosen by scripts/inflection/sweep_codec_latency.sh over 7 arms on a B200,
  # each verified COMPLETE (transcribed, opening words present) and CLEAN (no
  # clicks or discontinuities at chunk seams):
  #
  #   chunk  ctx   TTFA c=1   TTFA c=32   xRT c=32
  #       2    1       41ms       177ms       85.9   <- this profile
  #       4    2       53ms       211ms       90.3
  #       8    2       75ms       258ms       94.6
  #      16    4      117ms       363ms       98.0
  #      32    8      203ms       553ms       99.5
  #     300   25      335ms      1313ms       65.5   <- checkpoint default
  #
  # The stock 300 is worst at BOTH latency and throughput once streaming: large
  # chunks stall the pipeline instead of filling it. Past chunk=8 the throughput
  # curve flattens while TTFA keeps climbing, so the trade only bites at the top
  # end. chunk=2 buys the lowest TTFA for ~14% of peak throughput, and still
  # beats the default's throughput by 1.3x.
  #
  codec_chunk_frames: 2
  codec_left_context_frames: 1

  # Let the vocoder's left context GROW from 0 to left_context_frames instead
  # of demanding it in full on the first chunk, and emit a SHORTER first chunk.
  #
  # This is the split VoxServe calls first_chunk_frames and vllm-omni calls
  # codec_chunk_frames_at_begin, and it is the cheapest latency win available
  # here: time-to-first-audio is set by how many frames must decode before ANY
  # audio leaves, while throughput is set by the steady-state chunk. Decoupling
  # them costs one smaller vocoder call, once per request.
  #
  # Measured, one B200 per arm, 5 texts x 5 reps:
  #   chunk=2 alone         TTFA p50 45.6 ms
  #   chunk=2 + first=1     TTFA p50 30.6 ms   (-33%)
  #   vllm-omni             TTFA p50 39.2 ms
  # and at concurrency 32 throughput is unchanged (84.5x vs 86.1x realtime),
  # because the steady-state chunk never changed. Audio was transcribed to
  # confirm the shorter first chunk does not clip the opening word.
  codec_growing_left_context: true
  codec_first_chunk_frames: 1

resources:
  talker_attn:
    flashinfer_backend: fa2
node_groups:
  - node_names: [Talker]
    ranks: [0]
    graph_walks: [talker_prefill, talker_decode]
  - node_names: [Codec]
    ranks: [0]
    graph_walks: [codec_chunk]
